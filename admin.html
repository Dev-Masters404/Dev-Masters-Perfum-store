<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة تحكم المحل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="admin-page">

    <div class="login-screen" id="loginScreen">
      <form id="loginForm" class="login-form">
        <h2>دخول لوحة التحكم</h2>
        <input type="password" id="adminPassword" placeholder="كلمة السر" required>
        <p class="login-error" id="loginError"></p>
        <button type="submit" class="btn-primary">دخول</button>
      </form>
    </div>

    <div class="dashboard hidden" id="dashboard">
      <header class="admin-header">
        <h2>لوحة تحكم المحل</h2>
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="ordersSection">الطلبات</button>
          <button class="admin-tab" data-tab="productsSection">المنتجات</button>
        </div>
      </header>

      <section class="admin-section" id="ordersSection">
        <h3>صندوق الطلبات</h3>
        <div id="ordersList"></div>
      </section>

      <section class="admin-section hidden" id="productsSection">
        <h3>المنتجات الحالية</h3>
        <div id="adminProductsList" class="admin-products-list"></div>

        <h3>إضافة منتج جديد</h3>
        <form id="addProductForm" class="add-product-form">
          <input type="text" id="newNameAr" placeholder="اسم المنتج (عربي)" required>
          <input type="text" id="newNameEn" placeholder="اسم المنتج (إنجليزي)" required>
          <input type="number" id="newPrice" placeholder="السعر" required>
          <select id="newCategory">
            <option value="men">رجالي</option>
            <option value="women">حريمي</option>
            <option value="unisex">يونيسكس</option>
          </select>
          <input type="text" id="newImage" placeholder="مسار الصورة (images/perfume7.jpg)">
          <label class="checkbox-label"><input type="checkbox" id="newTrending"> منتج رائج (يظهر بالرئيسية)</label>
          <button type="submit" class="btn-primary">إضافة المنتج</button>
        </form>
      </section>
    </div>

  </div>

  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
